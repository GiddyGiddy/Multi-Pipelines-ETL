# ETL dispatcher defaults
dispatcher.pagination.size=50
dispatcher.max.message.size=160000

# Transport: sqs (default) or kafka
etl.messaging.transport=sqs

# SQS queue URLs used when etl.messaging.transport=sqs
messaging.entity1.binding=${ENTITY1_SQS_QUEUE_URL:https://sqs.eu-central-1.amazonaws.com/123456789012/entity1-queue.fifo}
messaging.entity2.binding=${ENTITY2_SQS_QUEUE_URL:https://sqs.eu-central-1.amazonaws.com/123456789012/entity2-queue.fifo}

# Kafka bindings used when etl.messaging.transport=kafka
# When kafka is enabled, set messaging.entityX.binding to these output binding names.
# messaging.entity1.binding=entity1-out-0
# messaging.entity2.binding=entity2-out-0
spring.cloud.stream.bindings.entity1-out-0.destination=${ENTITY1_KAFKA_TOPIC:entity1-topic}
spring.cloud.stream.bindings.entity2-out-0.destination=${ENTITY2_KAFKA_TOPIC:entity2-topic}
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
